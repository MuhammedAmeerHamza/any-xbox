<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">Any Xbox development progress</title><desc id="desc">Stage zero repository foundation complete. Stage one safe inspection foundations six of six checks, including bounded MicrosoftGame.config metadata parsing and parser fuzzing. Stage two machine model five of five checks, including a limited x86-64 interpreter and synthetic guest program execution. No Xbox game boots or runs.</desc>
<rect width="1100" height="500" rx="24" fill="#101b24"/><text x="48" y="58" fill="#f4f7f6" font-family="Arial,sans-serif" font-size="30" font-weight="700">DEVELOPMENT SNAPSHOT</text><text x="48" y="88" fill="#9fb2b7" font-family="Arial,sans-serif" font-size="16">Milestone progress — not a percentage of total Xbox game compatibility</text>
<g font-family="Arial,sans-serif">
<rect x="48" y="112" width="1004" height="82" rx="16" fill="#1a2b34"/><text x="76" y="145" fill="#dce9e7" font-size="19" font-weight="700">STAGE 0 · REPOSITORY FOUNDATION</text><text x="76" y="173" fill="#9fb2b7" font-size="15">C++20 / CMake · CLI · automated Windows + Linux CI</text><rect x="790" y="137" width="210" height="14" rx="7" fill="#79dc69"/><text x="1000" y="176" text-anchor="end" fill="#a9f48c" font-size="15" font-weight="700">3 / 3 COMPLETE</text>
<rect x="48" y="208" width="1004" height="82" rx="16" fill="#1a2b34"/><text x="76" y="241" fill="#dce9e7" font-size="19" font-weight="700">STAGE 1 · SAFE INSPECTION FOUNDATIONS</text><text x="76" y="269" fill="#9fb2b7" font-size="15">Guest memory · PE + manifest metadata · XVC naming · parser fuzzing</text><rect x="790" y="233" width="210" height="14" rx="7" fill="#31434a"/><rect x="790" y="233" width="210" height="14" rx="7" fill="#79dc69"/><text x="1000" y="272" text-anchor="end" fill="#a9f48c" font-size="15" font-weight="700">6 / 6 COMPLETE</text>
<rect x="48" y="304" width="1004" height="82" rx="16" fill="#1a2b34"/><text x="76" y="337" fill="#dce9e7" font-size="19" font-weight="700">STAGE 2 · MACHINE MODEL + FIRST INTERPRETER</text><text x="76" y="365" fill="#9fb2b7" font-size="15">CPU state · bounded interpreter · guest code demo · virtual ticks · exceptions · device interfaces</text><rect x="790" y="329" width="210" height="14" rx="7" fill="#31434a"/><rect x="790" y="329" width="210" height="14" rx="7" fill="#79dc69"/><text x="1000" y="368" text-anchor="end" fill="#a9f48c" font-size="15" font-weight="700">5 / 5 COMPLETE</text>
